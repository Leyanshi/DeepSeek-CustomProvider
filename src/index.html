<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <title>DeepSeek</title>
    <script defer src="./static/startup.js"></script>
    <style>
      #startup-state {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        padding: 24px;
        background: #fff;
        color: #222;
        font: 14px/1.6 sans-serif;
        text-align: center;
      }
      #startup-logo svg {
        display: block;
        width: 72px;
        height: 72px;
      }
      #startup-title {
        margin: 16px 0 0;
        color: #8a8a8a;
        font-size: 14px;
        font-weight: 400;
      }
      #startup-detail {
        max-width: 100%;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        text-align: left;
      }
      #startup-detail:empty,
      #startup-help:empty {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="startup-state" role="status">
        <div id="startup-logo"><%= startupLogo %></div>
        <p id="startup-title">加载中</p>
        <pre id="startup-detail"></pre>
        <p id="startup-help"></p>
        <button id="startup-retry" type="button" hidden style="padding: 12px 20px">重新加载</button>
      </div>
    </div>
  </body>
</html>
